[project]
name = "rlp-svc"
# The version lives in exactly one place: `rlp_svc.__version__`. It used to be
# restated here and in `cli.py`, guarded by a test that could only report the
# drift after it happened — three declarations of one fact is two too many.
dynamic = ["version"]
description = "RLP decision engine: laya triage gate, RLM decomposition, laya routing, headless plan, doctor. MCP server + CLI + library."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1,<2",
    "rlms>=0.1",
    "laya>=0.3",
    "httpx>=0.27",
]

[project.scripts]
# `rlp-svc` is the tool's own CLI; `rlp <subcommand>` in scripts/rlp forwards here.
rlp-svc = "rlp_svc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "rlp_svc.__version__" }

[tool.setuptools.packages.find]
include = ["rlp_svc*"]
